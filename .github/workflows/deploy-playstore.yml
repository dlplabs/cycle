name: Build and Deploy to Google Play Console

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Trilha do Google Play: internal, alpha, beta, production'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  deployment:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build AAB and Publish
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.track || github.event.deployment.environment || 'internal' }}
      url: https://play.google.com/console

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Check Available Secrets
        id: check_secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          PLAY_KEY: ${{ secrets.PLAY_STORE_JSON_KEY || secrets.PLAY_CONFIG_JSON_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PLAY_KEY" ]; then
            echo "has_play_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          python3 - << 'EOF'
          import os, base64

          b64_str = os.environ.get("RELEASE_KEYSTORE_BASE64", "").strip()
          keystore_path = "keystore/release.keystore"

          if b64_str:
              try:
                  decoded = base64.b64decode(b64_str)
                  if len(decoded) > 100:
                      with open(keystore_path, "wb") as f:
                          f.write(decoded)
                      print(f"Successfully decoded release keystore ({len(decoded)} bytes)")
                  else:
                      print("Decoded keystore too small, using fallback")
              except Exception as e:
                  print(f"Base64 decode warning: {e}")

          if not os.path.exists(keystore_path) or os.path.getsize(keystore_path) < 100:
              print("Generating fallback CI signing keystore...")
              alias = os.environ.get("KEY_ALIAS") or "cycle_release"
              pwd = os.environ.get("KEYSTORE_PASSWORD") or "android"
              cmd = f'keytool -genkeypair -v -keystore {keystore_path} -storetype JKS -alias "{alias}" -keyalg RSA -keysize 2048 -validity 10000 -storepass "{pwd}" -keypass "{pwd}" -dname "CN=Cycle CI, OU=Mobile, O=DLP, L=Sao Paulo, ST=SP, C=BR"'
              os.system(cmd)
          EOF

      - name: Build Release App Bundle (AAB)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEYSTORE_STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_KEY_ALIAS || 'cycle_release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD || 'android' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Play Account JSON
        if: steps.check_secrets.outputs.has_play_key == 'true'
        id: play_json
        env:
          PLAY_KEY_RAW: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_KEY_B64: ${{ secrets.PLAY_CONFIG_JSON_BASE64 }}
        run: |
          mkdir -p secrets
          if [ -n "$PLAY_KEY_RAW" ]; then
            echo "$PLAY_KEY_RAW" > secrets/play-account.json
          elif [ -n "$PLAY_KEY_B64" ]; then
            echo "$PLAY_KEY_B64" | base64 --decode > secrets/play-account.json
          fi

      - name: Deploy to Google Play Console
        if: steps.check_secrets.outputs.has_play_key == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: secrets/play-account.json
          packageName: br.com.dlpsystems.cycle
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || github.event.deployment.environment || 'internal' }}
          status: completed
